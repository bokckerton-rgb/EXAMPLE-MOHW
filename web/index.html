<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이건MOHW? · 법령 연혁 시험</title>
<style>
  :root { --bg:#fdf6ec; --card:#fffaf3; --ink:#3b2f2a; --quiet:#8a7a70; --accent:#f08a5d; --line:#ead9c6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:32px 20px 60px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--quiet); margin:0 0 24px; font-size:14px; }
  .search { display:flex; gap:8px; margin-bottom:12px; }
  .search input { flex:1; padding:12px 16px; border-radius:999px; border:2px solid var(--line); font-size:16px; background:#fff; }
  .search button { padding:12px 20px; border-radius:999px; border:0; background:var(--accent); color:#fff; font-size:16px; font-weight:700; cursor:pointer;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .chip { padding:6px 14px; border-radius:999px; background:#fff; border:2px solid var(--line); cursor:pointer; font-size:14px; }
  .notice { background:#fff3d6; border-radius:16px; padding:10px 14px; font-size:13px; margin-bottom:16px; }
  .board { background:var(--card); border-radius:24px; padding:20px 24px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.05), 0 6px 16px rgba(120,80,40,.08); }
  .board h2 { font-size:18px; margin:0 0 4px; }
  .laws { color:var(--quiet); font-size:13px; margin-bottom:16px; }
  .tl { list-style:none; margin:0; padding:0 0 0 20px; border-left:3px solid var(--line); }
  .tl li { position:relative; margin:0 0 18px; padding-left:8px; }
  .tl li::before { content:""; position:absolute; left:-31px; top:3px; width:16px; height:16px; border-radius:50%; background:var(--accent);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
  .date { font-weight:700; }
  .type { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:#ffe3d3; margin-left:6px; }
  .sample { background:#eee; color:#777; }
  .law { color:var(--quiet); font-size:13px; }
  .sum { margin-top:2px; }
  a { color:#c4622d; font-size:13px; }
  .empty { color:var(--quiet); }
</style>
</head>
<body>
<main>
  <h1>이건MOHW? · 법령 연혁 시험</h1>
  <p class="sub">업무 이름을 입력하면 소관 법령의 연혁이 나와요. (DB 없이 <code>data/law/law_data.js</code>를 읽어요)</p>

  <div class="search">
    <input id="q" placeholder="예: 아동수당" value="아동수당">
    <button id="go">보기</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="notice"></div>
  <section class="board" id="board"></section>
</main>

<script src="../data/law/law_data.js"></script>
<script>
  const D = window.LAW_DATA || { policies: {} };
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const fmt = d => d ? d.replace(/-/g, ".") : "날짜 확인 필요";

  // 정책 이름 버튼
  Object.keys(D.policies).forEach(name => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = name;
    b.onclick = () => { $("q").value = name; show(); };
    $("chips").appendChild(b);
  });

  if (!window.LAW_DATA) {
    $("notice").innerHTML = '<div class="notice">⚠ law_data.js를 찾지 못했어요. 폴더 구조가 맞는지 확인해 주세요.</div>';
  } else if (D.is_sample) {
    $("notice").innerHTML = '<div class="notice">⚠ 지금은 <b>예시 값</b>이에요. 법령 MCP 결과로 law_data.js를 바꾸면 실제 연혁이 나와요.</div>';
  }

  function show() {
    const q = $("q").value.trim().replace(/\s/g, "");
    const key = Object.keys(D.policies).find(k => k.replace(/\s/g, "").includes(q) || q.includes(k.replace(/\s/g, "")));
    if (!q || !key) {
      $("board").innerHTML = '<p class="empty">"' + esc(q) + '" 자료가 아직 없어요. law_data.js에 추가해 주세요.</p>';
      return;
    }
    const p = D.policies[key];
    const ev = [...(p.events || [])].sort((a, b) => (a.promulgated_on || "9999").localeCompare(b.promulgated_on || "9999"));
    $("board").innerHTML =
      '<h2>📜 ' + esc(key) + ' 소관 법령 연혁</h2>' +
      '<div class="laws">' + esc((p.laws || []).join(" · ")) + ' · 자료 기준일 ' + esc(D.observed_at || "-") + '</div>' +
      (ev.length ? '<ul class="tl">' + ev.map(e =>
        '<li><span class="date">' + fmt(e.promulgated_on) + ' 공포</span>' +
        (e.effective_on ? ' <span class="law">(' + fmt(e.effective_on) + ' 시행)</span>' : '') +
        '<span class="type' + (e.validation_status === "sample" ? " sample" : "") + '">' + esc(e.event_type || "개정") + '</span>' +
        '<div class="law">' + esc(e.law_name) + '</div>' +
        (e.summary ? '<div class="sum">' + esc(e.summary) + '</div>' : '') +
        (e.source_url ? '<a href="' + esc(e.source_url) + '" target="_blank" rel="noopener">원문 보기 ↗</a>' : '') +
        '</li>').join("") + '</ul>'
      : '<p class="empty">아직 연혁 자료가 없어요. 법령 MCP로 받아서 넣어 주세요.</p>');
  }

  $("go").onclick = show;
  $("q").addEventListener("keydown", e => { if (e.key === "Enter") show(); });
  show();
</script>
</body>
</html>
