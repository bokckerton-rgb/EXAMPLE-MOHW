<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이건MOHW? · 규제개혁법무담당관 칠판 시험</title>
<style>
  :root { --bg:#FBF3E8; --card:#FFFDF8; --ink:#3B2F2A; --quiet:#8A7A70; --tint:#E8E3FA; --border:#7A69C9; --line:#E6D8C6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:820px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--quiet); font-size:14px; margin:0 0 20px; }
  .search { display:flex; gap:8px; margin-bottom:10px; }
  .search input { flex:1; padding:12px 18px; border-radius:999px; border:2px solid var(--line); font-size:16px; background:#fff; }
  .btn { padding:12px 20px; border-radius:999px; border:0; background:var(--border); color:#fff; font-size:15px; font-weight:700; cursor:pointer;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.15), inset 0 3px 0 rgba(255,255,255,.25); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .chip { padding:6px 14px; border-radius:999px; background:#fff; border:2px solid var(--line); cursor:pointer; font-size:14px; }
  .notice { background:#FFF3D6; border-radius:16px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
  .law-row { background:#fff; border:2px dashed var(--line); border-radius:16px; padding:10px 14px; font-size:13px; margin-bottom:16px; }
  .teacher { display:flex; gap:14px; align-items:flex-start; margin-bottom:16px; }
  .face { flex:none; width:64px; height:64px; border-radius:50%; background:#F6D3B8; position:relative;
    box-shadow: inset -6px -8px 0 rgba(0,0,0,.08), inset 6px 6px 0 rgba(255,255,255,.4); }
  .face::before, .face::after { content:""; position:absolute; top:26px; width:7px; height:9px; border-radius:50%; background:#3B2F2A; }
  .face::before { left:19px; } .face::after { right:19px; }
  .bubble { flex:1; background:#fff; border-radius:20px; padding:14px 18px; position:relative;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.05), 0 4px 10px rgba(120,80,40,.08); }
  .who { font-size:12px; color:var(--border); font-weight:700; margin-bottom:4px; }
  .nav { display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:13px; color:var(--quiet); }
  .nav button { padding:6px 14px; font-size:13px; }
  .board { background:var(--card); border:3px solid var(--border); border-radius:26px; padding:18px 22px 14px; margin-bottom:16px;
    box-shadow: inset 0 -7px 0 rgba(0,0,0,.05), 0 6px 16px rgba(120,80,40,.08); }
  .board-head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:14px; }
  .board h2 { font-size:18px; margin:0; }
  .tag { font-size:12px; padding:3px 10px; border-radius:999px; background:var(--tint); white-space:nowrap; }
  .tl { list-style:none; margin:0; padding:0 0 0 22px; border-left:3px solid var(--line); }
  .tl li { position:relative; margin:0 0 14px; padding:8px 12px; border-radius:14px; transition:background .3s; }
  .tl li::before { content:""; position:absolute; left:-33px; top:12px; width:18px; height:18px; border-radius:50%; background:var(--border);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.3); }
  .tl li.hl { background:var(--tint); }
  .date { font-weight:800; }
  .num { font-size:12px; color:var(--quiet); margin-left:6px; }
  .ttl { font-weight:700; margin-top:2px; }
  .desc { font-size:14px; margin-top:2px; }
  .check { display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; margin-left:6px; background:#eee; color:#777; }
  .check.verified { background:#D8F1EA; color:#2C7A5E; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .card { background:#fff; border-radius:18px; padding:12px 14px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.05); }
  .card .tag { display:inline-block; margin-bottom:6px; }
  .note { font-size:12px; color:var(--quiet); margin-top:8px; }
  .empty { color:var(--quiet); }
</style>
</head>
<body>
<main>
  <h1>이건MOHW? · 규제개혁법무담당관 칠판 시험</h1>
  <p class="sub">업무 이름을 넣으면 소관 법령 연혁이 나와요. DB 없이 <code>data/law/law_data.js</code>를 읽어요.</p>

  <div class="search">
    <input id="q" placeholder="예: 아동수당" value="아동수당">
    <button class="btn" id="go">강의 듣기</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="notice"></div>
  <div id="out"></div>
</main>

<script src="../data/law/law_data.js"></script>
<script>
  const D = window.LAW_DATA || { policies:{} };
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  let P = null, li = 0;

  Object.keys(D.policies).forEach(name => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = name;
    b.onclick = () => { $("q").value = name; find(); };
    $("chips").appendChild(b);
  });

  if (!window.LAW_DATA) $("notice").innerHTML = '<div class="notice">⚠ law_data.js를 찾지 못했어요. web 폴더와 data 폴더가 같은 곳에 있는지 확인해 주세요.</div>';
  else if (D.is_sample) $("notice").innerHTML = '<div class="notice">⚠ 지금은 예시 값이에요.</div>';

  function find() {
    const q = $("q").value.replace(/\s/g, "");
    const key = Object.keys(D.policies).find(k => { const kk = k.replace(/\s/g, ""); return q && (kk.includes(q) || q.includes(kk)); });
    if (!key) { $("out").innerHTML = '<p class="empty">"' + esc($("q").value) + '" 자료가 아직 없어요. law_data.js에 추가해 주세요.</p>'; return; }
    P = { name:key, ...D.policies[key] }; li = 0; render();
  }

  function timeline(B, hl) {
    if (!B.items || !B.items.length) return '<p class="empty">아직 연혁 자료가 없어요.</p>';
    return '<ul class="tl">' + B.items.map((it, i) =>
      '<li class="' + (hl.includes(i) ? "hl" : "") + '">' +
      '<span class="date">' + esc(it.date) + '</span><span class="num">' + esc(it.sub) + '</span>' +
      (it.check ? '<span class="check ' + esc(it.check) + '">' + (it.check === "verified" ? "원문 대조" : it.check === "sample" ? "예시" : "자동 추출") + '</span>' : '') +
      '<div class="ttl">' + esc(it.title) + '</div><div class="desc">' + esc(it.desc) + '</div></li>').join("") + '</ul>';
  }

  function cards(B) {
    if (!B.items || !B.items.length) return '<p class="empty">아직 자료가 없어요.</p>';
    return '<div class="cards">' + B.items.map(c =>
      '<div class="card"><span class="tag" style="background:' + esc(c.chipBg || "#eee") + '">' + esc(c.chip) + '</span>' +
      '<div class="ttl">' + esc(c.title) + '</div><div class="desc">' + esc(c.desc) + '</div></div>').join("") + '</div>';
  }

  function board(key, hl) {
    const B = P[key]; if (!B) return "";
    return '<section class="board"><div class="board-head"><h2>' + esc(B.title) + '</h2><span class="tag">' + esc(B.chip) + '</span></div>' +
      (B.type === "cards" ? cards(B) : timeline(B, hl)) +
      (B.note ? '<div class="note">' + esc(B.note) + '</div>' : '') + '</section>';
  }

  function render() {
    const L = P.lines || [], line = L[li] || { t:"아직 강의 대사가 없어요.", b:"laws" };
    $("out").innerHTML =
      '<div class="law-row"><b>근거 법령</b> · ' + esc(P.lawRow) + '</div>' +
      '<div class="teacher"><div class="face"></div><div class="bubble"><div class="who">규제개혁법무담당관</div>' + esc(line.t) +
      '<div class="nav"><button class="btn" id="prev">◀ 이전</button><span>' + (L.length ? (li + 1) + ' / ' + L.length : '') + '</span><button class="btn" id="next">다음 ▶</button></div></div></div>' +
      board(line.b || "laws", line.hl || []) +
      (line.b === "lawStruct" ? "" : board("lawStruct", []));
    $("prev").onclick = () => { if (li > 0) { li--; render(); } };
    $("next").onclick = () => { if (li < L.length - 1) { li++; render(); } };
  }

  $("go").onclick = find;
  $("q").addEventListener("keydown", e => { if (e.key === "Enter") find(); });
  find();
</script>
</body>
</html>
